# Publishes this static site to GitHub Pages so fetch() to FormSubmit works.
# Neocities (free) blocks outbound form posts and third-party connect — see
# https://content-security-policy.neocities.org/
#
# First-time setup (once): GitHub → Settings → Pages → Source: GitHub Actions
# URL: https://backyardbugs.github.io/sleepyhead-website/
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
