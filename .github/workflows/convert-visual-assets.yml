name: Convert visual assets to WebP

on:
  push:
    paths:
      - "visuals/**"
      - "scripts/convert-high-press.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-high-press:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install pillow

      - name: Convert High Press uploads
        run: |
          shopt -s nullglob
          sources=(visuals/graphic-design/high-press/*.{png,PNG,jpg,jpeg,JPG,JPEG})
          if [ "${#sources[@]}" -gt 0 ]; then
            python3 scripts/convert-high-press.py
          else
            echo "No raster sources to convert."
          fi
        shell: bash

      - name: Commit WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visuals/graphic-design/high-press/*.webp data/visual-work.json || true
          git diff --staged --quiet || git commit -m "Convert High Press assets to WebP"
          git push
