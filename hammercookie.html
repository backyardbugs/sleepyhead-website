<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hammer — Sleepyhead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=7">
    <style>
        .hc-stage {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
            margin-top: 1rem;
        }
        .hc-character {
            position: relative;
            width: min(480px, 100%);
            aspect-ratio: 1;
            background: var(--bg-color);
        }
        .hc-character img,
        .hc-character video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .hc-character video {
            opacity: 0;
            pointer-events: none;
        }
        .hc-character video.is-playing {
            opacity: 1;
        }
        .hc-character img.is-hidden {
            visibility: hidden;
        }
        .hc-hammer-btn {
            flex: 0 0 auto;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            line-height: 0;
        }
        .hc-hammer-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .hc-hammer-btn img {
            display: block;
            width: min(140px, 30vw);
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside id="sidebar-container"></aside>
        <main>
            <div class="hc-stage">
                <div class="hc-character">
                    <img id="hc-idle" src="hammercookie/idle4.gif?v=3" alt="" width="640" height="640">
                    <video id="hc-hammer" playsinline muted preload="auto">
                        <source src="hammercookie/dream2.webm?v=1" type="video/webm">
                        <source src="hammercookie/Dream%202.mov?v=1" type="video/quicktime">
                    </video>
                </div>
                <button type="button" class="hc-hammer-btn" id="hc-hammer-btn" aria-label="Hammer">
                    <img src="hammercookie/hammer.png?v=3" alt="">
                </button>
            </div>
        </main>
    </div>

    <script src="loader.js?v=4"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var IDLE_SRC = "hammercookie/idle4.gif?v=3";

            var idleEl = document.getElementById("hc-idle");
            var hammerVideo = document.getElementById("hc-hammer");
            var hammerBtn = document.getElementById("hc-hammer-btn");
            var playing = false;

            hammerVideo.loop = false;

            function restartIdle() {
                idleEl.src = IDLE_SRC + "&t=" + Date.now();
            }

            function finishHammer() {
                hammerVideo.pause();
                hammerVideo.classList.remove("is-playing");
                idleEl.classList.remove("is-hidden");
                restartIdle();
                playing = false;
                hammerBtn.disabled = false;
            }

            function playHammerAnim() {
                playing = true;
                hammerBtn.disabled = true;
                idleEl.classList.add("is-hidden");
                hammerVideo.classList.add("is-playing");
                hammerVideo.currentTime = 0;
                var playPromise = hammerVideo.play();
                if (playPromise && playPromise.catch) {
                    playPromise.catch(function () {
                        finishHammer();
                    });
                }
            }

            hammerVideo.addEventListener("ended", finishHammer);

            hammerBtn.addEventListener("pointerdown", function (e) {
                e.preventDefault();
                if (!playing) {
                    playHammerAnim();
                }
            });

            hammerBtn.addEventListener("click", function (e) {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
