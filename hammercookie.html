<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hammer — Sleepyhead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=15">
    <script src="muji-init.js"></script>
    <script src="accent-init.js?v=3"></script>
    <style>
        .hc-stage {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
            margin-top: 1rem;
        }
        .hc-character {
            width: min(480px, 100%);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
        }
        .hc-character img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .hc-hammer-btn {
            flex: 0 0 auto;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            line-height: 0;
        }
        .hc-hammer-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .hc-hammer-btn img {
            display: block;
            width: min(140px, 30vw);
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside id="sidebar-container"></aside>
        <main>
            <div class="hc-stage">
                <div class="hc-character">
                    <img id="hc-sprite" src="hammercookie/idle4.gif?v=4" alt="" width="640" height="640">
                </div>
                <button type="button" class="hc-hammer-btn" id="hc-hammer-btn" aria-label="Hammer">
                    <img src="hammercookie/hammer.png?v=4" alt="">
                </button>
            </div>
        </main>
    </div>

    <script src="loader.js?v=8"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var IDLE_SRC = "hammercookie/idle4.gif?v=4";
            var HAMMER_SRC = "hammercookie/Dream%208.gif?v=4";
            var HAMMER_MS = 1000;

            var sprite = document.getElementById("hc-sprite");
            var hammerBtn = document.getElementById("hc-hammer-btn");
            var playing = false;
            var revertTimer = null;

            new Image().src = HAMMER_SRC;

            function returnToIdle() {
                sprite.src = IDLE_SRC + "&t=" + Date.now();
                playing = false;
                hammerBtn.disabled = false;
            }

            function playHammerAnim() {
                playing = true;
                hammerBtn.disabled = true;
                if (revertTimer) {
                    clearTimeout(revertTimer);
                }
                sprite.src = HAMMER_SRC + "&t=" + Date.now();
                revertTimer = setTimeout(returnToIdle, HAMMER_MS);
            }

            hammerBtn.addEventListener("pointerdown", function (e) {
                e.preventDefault();
                if (!playing) {
                    playHammerAnim();
                }
            });

            hammerBtn.addEventListener("click", function (e) {
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
