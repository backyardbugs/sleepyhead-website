<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visuals - Sleepyhead</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=25">
    <script src="muji-init.js"></script>
    <script src="theme-init.js"></script>
    <script src="accent-init.js?v=4"></script>
</head>
<body>

    <div class="container">
        <aside id="sidebar-container"></aside>

        <main>
            <h1 class="page-heading">Visual Works</h1>

            <h2 class="post-title">Comics</h2>
            <div id="comics-grid" class="art-grid art-grid--stacks">
                <div style="grid-column:1/-1;color:#666;">Loading…</div>
            </div>

            <h2 class="post-title" style="margin-top:60px;">Illustration</h2>
            <div id="illustration-grid" class="art-grid art-grid--stacks">
                <div style="grid-column:1/-1;color:#666;">Loading…</div>
            </div>

            <h2 class="post-title" style="margin-top:60px;">Graphic design</h2>
            <div id="graphic-design-grid" class="art-grid art-grid--stacks">
                <div style="grid-column:1/-1;color:#666;">Loading…</div>
            </div>
        </main>
    </div>

    <div id="lightbox">
        <span class="close-lightbox" onclick="closeLightbox()" role="button" tabindex="0" aria-label="Close">×</span>
        <button id="prev-btn" class="lightbox-nav" type="button" onclick="changePage(-1)">❮</button>
        <button id="next-btn" class="lightbox-nav" type="button" onclick="changePage(1)">❯</button>
        <img id="lightbox-img" src="" alt="">
        <div id="page-counter">1 / 1</div>
        <div id="lightbox-caption"></div>
    </div>

    <script src="loader.js?v=8"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var lightbox = document.getElementById('lightbox');
            var imgElement = document.getElementById('lightbox-img');
            var captionElement = document.getElementById('lightbox-caption');
            var counterElement = document.getElementById('page-counter');
            var nextBtn = document.getElementById('next-btn');
            var prevBtn = document.getElementById('prev-btn');

            var currentGallery = [];
            var currentPageIndex = 0;
            var currentCaption = { title: '', subtitle: '', info: '' };
            var seriesById = {};

            function escapeHtml(s) {
                var d = document.createElement('div');
                d.textContent = s || '';
                return d.innerHTML;
            }

            function openLightbox() {
                lightbox.style.display = 'flex';
            }

            function closeLightbox() {
                lightbox.style.display = 'none';
                imgElement.src = '';
                currentGallery = [];
            }

            function setNavVisible(show) {
                [nextBtn, prevBtn, counterElement].forEach(function (el) {
                    if (show) {
                        el.classList.remove('hidden');
                    } else {
                        el.classList.add('hidden');
                    }
                });
            }

            function renderCaption() {
                var c = currentCaption;
                var html = '<strong>' + escapeHtml(c.title) + '</strong>';
                if (c.subtitle) {
                    html +=
                        '<br><span style="font-size:0.85em;color:#aaa;">' +
                        escapeHtml(c.subtitle) +
                        '</span>';
                }
                if (c.info) {
                    html +=
                        '<br><span style="font-size:0.85em;color:#ccc;font-family:var(--font-body);">' +
                        escapeHtml(c.info) +
                        '</span>';
                }
                captionElement.innerHTML = html;
            }

            function updateLightbox() {
                if (!currentGallery.length) {
                    return;
                }
                imgElement.src = currentGallery[currentPageIndex];
                imgElement.alt = currentCaption.title || 'Artwork';
                counterElement.textContent = currentPageIndex + 1 + ' / ' + currentGallery.length;
                renderCaption();
            }

            function openGallery(images, caption, startIndex) {
                if (!images || !images.length) {
                    return;
                }
                currentGallery = images.slice();
                currentPageIndex = startIndex || 0;
                currentCaption = caption || {};
                setNavVisible(currentGallery.length > 1);
                updateLightbox();
                openLightbox();
            }

            window.openReader = function (comicId) {
                var comic = seriesById[comicId];
                if (!comic || !comic.pages || !comic.pages.length) {
                    return;
                }
                openGallery(comic.pages, {
                    title: comic.title,
                    subtitle: '',
                    info: comic.info || ''
                }, 0);
            };

            window.changePage = function (direction) {
                if (!currentGallery.length) {
                    return;
                }
                var next = currentPageIndex + direction;
                if (next >= 0 && next < currentGallery.length) {
                    currentPageIndex = next;
                    updateLightbox();
                }
            };

            window.closeLightbox = closeLightbox;

            function createStackButton(item) {
                var images = item.images || [];
                var cover = item.cover || images[0] || '';
                var back1 = images[1] || cover;
                var back2 = images[2] || back1;
                var count = images.length;

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'art-stack';
                btn.setAttribute('aria-label', item.title + ', ' + count + ' images');

                btn.innerHTML =
                    '<div class="art-stack-layers">' +
                    '<div class="art-stack-layer art-stack-layer--back1"><img src="' +
                    escapeHtml(back2) +
                    '" alt="" loading="lazy"></div>' +
                    '<div class="art-stack-layer art-stack-layer--back2"><img src="' +
                    escapeHtml(back1) +
                    '" alt="" loading="lazy"></div>' +
                    '<div class="art-stack-layer art-stack-layer--front"><img src="' +
                    escapeHtml(cover) +
                    '" alt="' +
                    escapeHtml(item.title) +
                    '" loading="lazy"></div>' +
                    '</div>' +
                    '<div class="art-stack-meta">' +
                    '<h3 class="art-stack-title">' +
                    escapeHtml(item.title) +
                    '</h3>' +
                    (item.subtitle
                        ? '<p class="art-stack-subtitle">' + escapeHtml(item.subtitle) + '</p>'
                        : '') +
                    '<div class="art-stack-count">' +
                    count +
                    ' piece' +
                    (count === 1 ? '' : 's') +
                    '</div>' +
                    '</div>';

                btn.addEventListener('click', function () {
                    openGallery(images, {
                        title: item.title,
                        subtitle: item.subtitle || '',
                        info: ''
                    }, 0);
                });

                return btn;
            }

            function createSeriesCard(item) {
                var wrap = document.createElement('div');
                wrap.className = 'art-item art-series-card';
                wrap.setAttribute('role', 'button');
                wrap.tabIndex = 0;
                wrap.innerHTML =
                    '<img src="' +
                    escapeHtml(item.cover) +
                    '" alt="' +
                    escapeHtml(item.title) +
                    '" loading="lazy">' +
                    '<div style="position:absolute;bottom:0;background:rgba(0,0,0,0.85);color:#fff;width:100%;font-size:12px;padding:8px 6px;text-align:center;font-family:var(--font-head);">' +
                    escapeHtml(item.title).toUpperCase() +
                    '</div>';
                var open = function () {
                    openReader(item.id);
                };
                wrap.addEventListener('click', open);
                wrap.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        open();
                    }
                });
                return wrap;
            }

            function createSingleCard(item) {
                var url = item.image || item.cover;
                var wrap = document.createElement('div');
                wrap.className = 'art-item';
                wrap.innerHTML =
                    '<img src="' +
                    escapeHtml(url) +
                    '" alt="' +
                    escapeHtml(item.title) +
                    '" loading="lazy">';
                wrap.addEventListener('click', function () {
                    openGallery([url], { title: item.title, subtitle: item.subtitle || '', info: item.info || '' }, 0);
                });
                return wrap;
            }

            function renderSection(container, items) {
                if (!container) {
                    return;
                }
                if (!items || !items.length) {
                    container.innerHTML =
                        '<div style="grid-column:1/-1;color:#666;font-style:italic;">Nothing here yet.</div>';
                    return;
                }
                container.innerHTML = '';
                items.forEach(function (item) {
                    var type = item.type || 'stack';
                    var el;
                    if (type === 'series') {
                        seriesById[item.id] = item;
                        el = createSeriesCard(item);
                    } else if (type === 'single') {
                        el = createSingleCard(item);
                    } else {
                        el = createStackButton(item);
                    }
                    container.appendChild(el);
                });
            }

            document.addEventListener('keydown', function (e) {
                if (lightbox.style.display === 'flex') {
                    if (e.key === 'ArrowLeft') {
                        changePage(-1);
                    }
                    if (e.key === 'ArrowRight') {
                        changePage(1);
                    }
                    if (e.key === 'Escape') {
                        closeLightbox();
                    }
                }
            });

            lightbox.addEventListener('click', function (e) {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            fetch('data/visual-work.json?v=' + Date.now())
                .then(function (r) {
                    return r.json();
                })
                .then(function (data) {
                    (data.comics || []).forEach(function (item) {
                        if (item.type === 'series') {
                            seriesById[item.id] = item;
                        }
                    });
                    renderSection(document.getElementById('comics-grid'), data.comics || []);
                    renderSection(document.getElementById('illustration-grid'), data.illustration || []);
                    renderSection(document.getElementById('graphic-design-grid'), data.graphicDesign || []);
                })
                .catch(function (err) {
                    console.error(err);
                    var msg =
                        '<div style="grid-column:1/-1;color:#ff6b6b;">Could not load visual work data.</div>';
                    ['comics-grid', 'illustration-grid', 'graphic-design-grid'].forEach(function (id) {
                        var el = document.getElementById(id);
                        if (el) {
                            el.innerHTML = msg;
                        }
                    });
                });
        });
    </script>

</body>
</html>
