<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepyhead Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=20">
    <link rel="alternate" type="application/rss+xml" title="Sleepyhead Studio" href="https://sleepytyler.neocities.org/feed.xml">
    <script src="muji-init.js"></script>
    <script src="theme-init.js"></script>
    <script src="accent-init.js?v=4"></script>

</head>
<body>

    <div class="container">
        
        <aside id="sidebar-container"></aside>

        <main>
            <div id="blog-feed"></div> 
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    
    <script>
    (function() {
        var stamp = Date.now();

        var scriptsToLoad = [
            "loader.js",
            "blog.js"
        ];
        
        function loadScript(src, callback) {
            var s = document.createElement('script');
            s.src = src + "?v=" + stamp;
            s.onload = callback;
            document.body.appendChild(s);
        }

        loadScript("loader.js");
        
        loadScript("blog.js", function() {
            loadScript("engine.js");
        });

    })();
    </script>

</body>
</html>
