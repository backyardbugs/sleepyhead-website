<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - Sleepyhead</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=7">
    <script src="muji-init.js"></script>
    <style>
        .music-nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }
        .music-nav-item {
            position: relative;
            aspect-ratio: 4 / 3;
            border: 1px solid #333;
            text-align: left;
            background: #1a1a1a;
            transition: border-color 0.2s, transform 0.2s;
            text-decoration: none;
            display: block;
            overflow: hidden;
            border-radius: 4px;
        }
        .music-nav-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .music-nav-item img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .music-nav-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 18px;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.88) 0%,
                rgba(0, 0, 0, 0.45) 50%,
                transparent 72%
            );
            pointer-events: none;
        }
        .music-nav-title {
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #fff;
            display: block;
            margin-bottom: 4px;
            border-bottom: none;
        }
        .music-nav-item:hover .music-nav-title {
            color: var(--accent-color);
        }
        .music-nav-desc {
            font-family: var(--font-body);
            font-size: 0.8rem;
            color: #ccc;
            font-style: italic;
            line-height: 1.35;
        }
    </style>
</head>
<body>
    <div class="container">
       <aside id="sidebar-container"></aside>
        <main>
            <h1 style="font-family: var(--font-head); border-bottom: 2px solid #fff; padding-bottom: 10px;">Music</h1>
            
            <div class="music-nav-grid">
                <a href="julep.html" class="music-nav-item">
                    <img src="img/music/julep.jpg" alt="">
                    <div class="music-nav-overlay">
                        <span class="music-nav-title">JULEP</span>
                    </div>
                </a>
                <a href="highpress.html" class="music-nav-item">
                    <img src="img/music/highpress.jpg" alt="">
                    <div class="music-nav-overlay">
                        <span class="music-nav-title">HIGH PRESS</span>
                    </div>
                </a>
                <a href="demos.html" class="music-nav-item">
                    <img src="img/music/democrate.jpg" alt="">
                    <div class="music-nav-overlay">
                        <span class="music-nav-title">THE DEMO CRATE</span>
                    </div>
                </a>
                <a href="engineering.html" class="music-nav-item">
                    <img src="img/music/audioengineering.jpg" alt="">
                    <div class="music-nav-overlay">
                        <span class="music-nav-title">AUDIO ENGINEERING</span>
                        <span class="music-nav-desc">Mix · master · production</span>
                    </div>
                </a>
            </div>

            <!-- ALL UPCOMING SHOWS -->
            <h2 style="font-family: var(--font-head);">Show Dates</h2>
            <div id="shows-container"></div>
            
            <button id="toggle-history-btn" style="
                background: transparent;
                border: 1px solid #444;
                color: #888;
                font-family: var(--font-head);
                padding: 10px 20px;
                cursor: pointer;
                margin-top: 20px;
                display: block;
                width: 100%;
            ">View Past Shows</button>

        </main>
    </div>

    <script src="loader.js?v=6"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load only upcoming initially
            loadShows('shows-container', 'ALL', false);

            document.getElementById('toggle-history-btn').addEventListener('click', function() {
                this.style.display = 'none'; // Hide button
                loadShows('shows-container', 'ALL', true); // Reload with history
            });
        });
    </script>
</body>
</html>
