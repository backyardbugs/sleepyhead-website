<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Log 2025 - Sleepyhead</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=20">
    <script src="muji-init.js"></script>
    <script src="theme-init.js"></script>
    <script src="accent-init.js?v=4"></script>

    <style>
        /* --- ALMANAC SPECIFIC STYLES --- */
        
        .hud-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 28px 20px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 40px;
            align-items: start;
        }

        @media (max-width: 600px) {
            .hud-container {
                grid-template-columns: 1fr;
                gap: 28px;
            }
        }

        .hud-stamp {
            text-align: center;
            background: none;
            border: none;
            padding: 0;
        }

        .hud-stamp-icon {
            display: block;
            width: 88px;
            height: 88px;
            object-fit: contain;
            margin: 0 auto 8px;
        }

        .hud-value {
            font-family: var(--font-head);
            font-size: 1.8rem;
            color: var(--accent-color);
            font-weight: bold;
            display: block;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .hud-label {
            font-family: var(--font-head);
            font-size: 0.75rem;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 0;
        }

        .advanced-stats {
            grid-column: 1 / -1;
            margin-top: 8px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }

        .advanced-stats .hud-value {
            font-size: 1.25rem;
        }

        .ledger-heading {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .ledger-heading-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .ledger-heading .post-title {
            margin: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .calendar-wrapper {
            overflow-x: auto;
            padding-bottom: 20px;
            margin-bottom: 60px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) var(--bg-color);
        }

        .calendar-container {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .weekday-labels {
            display: grid;
            grid-template-rows: repeat(7, 1fr);
            gap: 4px;
            flex: 0 0 auto;
        }

        .weekday-label {
            width: 28px;
            height: 12px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-family: var(--font-head);
            font-size: 0.65rem;
            line-height: 12px;
            letter-spacing: 1px;
            color: var(--text-faint);
            user-select: none;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(53, 1fr); 
            grid-template-rows: repeat(7, 1fr);     
            grid-auto-flow: column;
            gap: 4px;
            min-width: 800px;
        }

        .day-cell {
            width: 12px;
            height: 12px;
            background-color: var(--bg-muted);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            box-sizing: border-box;
        }

        .day-cell.placeholder {
            visibility: hidden;
            pointer-events: none;
        }

        #tooltip {
            position: fixed;
            background: var(--bg-elevated);
            color: var(--text-color);
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            font-size: 0.75rem;
            font-family: var(--font-head);
            white-space: pre-wrap;
            max-width: 300px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            border-radius: 4px;
            box-shadow: var(--shadow);
            transform: translate(-50%, -120%);
        }

        .day-cell::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: var(--theme-color, #8a703e);
            opacity: var(--theme-opacity, 0);
            z-index: 1;
            transition: opacity 0.2s;
        }

        .lvl-0 { --theme-opacity: 0.12; }
        .lvl-1 { --theme-opacity: 0.40; }
        .lvl-2 { --theme-opacity: 0.70; }
        .lvl-3 { --theme-opacity: 1; }

        .season-winter { --theme-color: #64b5f6; } 
        .season-spring { --theme-color: #9ccc65; }
        .season-summer { --theme-color: #ffb74d; }
        .season-fall   { --theme-color: #e57373; }

        .gym-dot {
            width: 4px;
            height: 4px;
            background-color: var(--text-strong);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 2px color-mix(in srgb, var(--bg-deep) 70%, transparent);
            z-index: 5;
        }

        .has-note::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            border-style: solid;
            border-width: 0 6px 6px 0;
            border-color: transparent color-mix(in srgb, var(--text-strong) 45%, transparent) transparent transparent;
            z-index: 5;
        }

        .has-post {
            border: 1px solid var(--text-strong) !important;
            box-shadow: 0 0 5px color-mix(in srgb, var(--text-strong) 30%, transparent);
            cursor: pointer;
        }

        .ledger-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        @media (max-width: 768px) {
            .ledger-grid { grid-template-columns: 1fr; gap: 40px; }
        }

        .ledger-item {
            border-bottom: 1px dashed var(--border-color);
            padding: 10px 0;
            font-size: 0.95rem;
        }
        
        .ledger-title { color: var(--text-strong); font-weight: bold; }
        .ledger-meta { color: var(--text-soft); font-size: 0.85rem; display: block; margin-top: 4px;}
        .rating-stars { color: var(--accent-color); font-size: 0.8rem; margin-left: 10px; }

        .log-muted { color: var(--text-faint); }
        .log-soft { color: var(--text-soft); }
        .log-strong { color: var(--text-strong); font-weight: bold; }
        .log-divider {
            border-top: 1px dashed var(--border-color);
        }
        .legend-swatch-empty {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--border-strong);
            margin-right: 5px;
        }
        .legend-swatch-gym {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-strong);
            border-radius: 50%;
            margin-right: 5px;
        }
        .legend-swatch-note {
            display: inline-block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 6px 6px 0;
            border-color: transparent var(--text-faint) transparent transparent;
            margin-right: 5px;
            position: relative;
            top: 2px;
        }
        .legend-swatch-post {
            display: inline-block;
            width: 8px;
            height: 8px;
            border: 1px solid var(--text-strong);
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <aside id="sidebar-container"></aside>

        <main>
            <h1 id="year-title" class="page-heading">
                Captain's Log <span style="color:var(--accent-color)">//</span> 2026
            </h1>

            <div style="margin-bottom: 20px; font-family: var(--font-head); font-size: 0.9rem; margin-top: 10px;">
                <span class="log-muted" style="margin-right:10px;">SELECT YEAR:</span>
                <a href="?y=2025" style="margin-right: 10px;">[ 2025 ]</a>
                <a href="?y=2026">[ 2026 ]</a>
            </div>

            <div class="hud-container">
                <div class="hud-stamp">
                    <img class="hud-stamp-icon" src="img/doodles/pieceofpaper.png" alt="" width="88" height="88">
                    <span class="hud-value" id="total-words">0</span>
                    <span class="hud-label">Total Words</span>
                </div>
                <div class="hud-stamp">
                    <img class="hud-stamp-icon" src="img/doodles/shredded.png" alt="" width="88" height="88">
                    <span class="hud-value" id="total-workouts">0</span>
                    <span class="hud-label">Workouts</span>
                </div>
                <div class="hud-stamp">
                    <img class="hud-stamp-icon" src="img/doodles/snorlaxbook.png" alt="" width="88" height="88">
                    <span class="hud-value" id="total-books">0</span>
                    <span class="hud-label">Books Read</span>
                </div>
            </div>

            <h2 class="post-title" style="font-size: 1.2rem; color: var(--text-faint);">Consistency Graph</h2>
            
            <div style="display:flex; flex-direction:column; gap:10px; font-size:0.75rem; color:var(--text-faint); font-family:var(--font-head); margin-bottom:20px;">
                <div style="display:flex; gap:20px; flex-wrap: wrap;">
                    <span><span class="legend-swatch-empty"></span>Color Intensity = Word Count</span>
                    <span><span class="legend-swatch-gym"></span>Dot = Gym</span>
                    <span><span class="legend-swatch-note"></span>Corner = Note</span>
                    <span><span class="legend-swatch-post"></span>Border = Blog Post</span>
                </div>
                
                <!-- SEASONAL KEY -->
                <div class="log-divider" style="display:flex; gap:15px; padding-top: 10px; max-width: fit-content;">
                    <span class="log-soft">SEASONS:</span>
                    <span style="display:flex; align-items:center;">
                        <span style="display:inline-block; width:8px; height:8px; background:#64b5f6; margin-right:5px;"></span>Winter
                    </span>
                    <span style="display:flex; align-items:center;">
                        <span style="display:inline-block; width:8px; height:8px; background:#9ccc65; margin-right:5px;"></span>Spring
                    </span>
                    <span style="display:flex; align-items:center;">
                        <span style="display:inline-block; width:8px; height:8px; background:#ffb74d; margin-right:5px;"></span>Summer
                    </span>
                    <span style="display:flex; align-items:center;">
                        <span style="display:inline-block; width:8px; height:8px; background:#e57373; margin-right:5px;"></span>Fall
                    </span>
                </div>
            </div>

            <div class="calendar-wrapper">
                <div class="calendar-container">
                    <div class="weekday-labels" aria-hidden="true">
                        <div class="weekday-label">SUN</div>
                        <div class="weekday-label">MON</div>
                        <div class="weekday-label">TUE</div>
                        <div class="weekday-label">WED</div>
                        <div class="weekday-label">THU</div>
                        <div class="weekday-label">FRI</div>
                        <div class="weekday-label">SAT</div>
                    </div>
                    <div id="year-grid" class="calendar-grid"></div>
                </div>
            </div>
            
            <div class="ledger-grid">
                
                <div>
                    <div class="ledger-heading">
                        <img class="ledger-heading-icon" src="img/doodles/sleepybook.png" alt="" width="64" height="64">
                        <h2 class="post-title">Library</h2>
                    </div>
                    <div id="book-list"></div>
                </div>

                <div>
                    <div class="ledger-heading">
                        <img class="ledger-heading-icon" src="img/doodles/58microphone.png" alt="" width="64" height="64">
                        <h2 class="post-title">Bands Seen</h2>
                    </div>
                    <div id="band-list"></div>
                </div>

            </div>

        </main>
    </div>

    <div id="tooltip"></div>

    <script>
    /* --- AUTO-LOADER (Cache Busting) --- */
    (function() {
        var stamp = Date.now();
        // Added blog.js to the list to get post data
        var scripts = ["data/2025.js", "data/2026.js", "blog.js", "loader.js"];
        var loaded = 0;

        scripts.forEach(function(src) {
            var s = document.createElement('script');
            s.src = src + "?v=" + stamp;
            s.onload = function() {
                loaded++;
                if (loaded === scripts.length) {
                    initDashboard();
                }
            };
            document.body.appendChild(s);
        });
    })();

    /* --- THE ENGINE --- */
    // Expose initDashboard globally so loader.js can call it
    window.generateGrid = initDashboard;

    function toLocalISODate(date) {
        const d = date || new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
    }

    function initDashboard() {
            
            // 0. YEAR SELECTION
            const params = new URLSearchParams(window.location.search);
            const currentYear = parseInt(params.get('y')) || 2026;

            // Update Titles
            document.title = `Captain's Log ${currentYear} - Sleepyhead`;
            document.getElementById('year-title').innerHTML = `Captain's Log <span style="color:var(--accent-color)">//</span> ${currentYear}`;

            // Select Data Sources
            let activeHistory = [];
            let activeBooks = [];
            let activeAlbums = [];
            let activeStats = [];
            let activeShows = [];

            if (currentYear === 2025) {
                activeHistory = (typeof history2025 !== 'undefined') ? history2025 : [];
                activeBooks = (typeof books2025 !== 'undefined') ? books2025 : [];
                activeAlbums = (typeof albums2025 !== 'undefined') ? albums2025 : [];
                activeStats = (typeof stats2025 !== 'undefined') ? stats2025 : [];
                activeShows = (typeof shows2025 !== 'undefined') ? shows2025 : [];
            } else {
                activeHistory = (typeof history2026 !== 'undefined') ? history2026 : [];
                activeBooks = (typeof books2026 !== 'undefined') ? books2026 : [];
                activeAlbums = (typeof albums2026 !== 'undefined') ? albums2026 : [];
                activeStats = (typeof stats2026 !== 'undefined') ? stats2026 : [];
                activeShows = (typeof shows2026 !== 'undefined') ? shows2026 : [];
            }

            // 1. PROCESS TOTALS
            let totalWords = 0;
            let totalWorkouts = 0;

            // Create a quick lookup map for dates
            const dayMap = {};

            // Workout rows often carry a short "Gym" label for counting; that should not
            // trigger the dog-ear (tweet-style notes only). Gym dot still comes from `gym`.
            function isGymOnlyNote(text) {
                const t = (text || "").trim();
                if (!t) return false;
                return /^Gym(\s*\([^)]+\))?\.?$/i.test(t);
            }

            function isExcludedLogNote(text) {
                const n = (text || "").trim();
                if (!n) return false;
                return /^start of 2026\.?$/i.test(n)
                    || /^i spent way too much time working on the website today\.?$/i.test(n);
            }

            activeHistory.forEach(entry => {
                const date = entry[0];
                const words = entry[1];
                const gym = entry[2];
                const note = entry[3] || "";

                totalWords += words;
                if (gym) totalWorkouts++;

                if (!dayMap[date]) {
                    dayMap[date] = { words: 0, gym: false, notes: [] };
                }
                
                dayMap[date].words += words;
                if (gym) dayMap[date].gym = true;
                if (note && !isExcludedLogNote(note) && !(gym && isGymOnlyNote(note))) {
                    dayMap[date].notes.push(note);
                }
            });

            // Update HUD
            document.getElementById('total-words').innerText = totalWords.toLocaleString();
            document.getElementById('total-workouts').innerText = totalWorkouts;
            
            const totalBooksEl = document.getElementById('total-books');
            const totalAlbumsEl = document.getElementById('total-albums');
            
            if (totalBooksEl && activeBooks) totalBooksEl.innerText = activeBooks.length;
            if (totalAlbumsEl && activeAlbums) totalAlbumsEl.innerText = activeAlbums.length; 

            // --- ADVANCED STATS CALCULATION ---
            let maxWords = 0;
            let currentWritingStreak = 0;
            let longestWritingStreak = 0;
            let currentWorkoutStreak = 0;
            let longestWorkoutStreak = 0;

            let lastWritingDate = null;
            let lastWorkoutDate = null;

            // Sort history by date to ensure proper streak calculation
            const sortedHistory = activeHistory.slice().sort((a, b) => new Date(a[0]) - new Date(b[0]));
            
            // Helpful Set for O(1) lookups of dates that exist in history with >0 words or gym
            const writingDays = new Set();
            const workoutDays = new Set();

            sortedHistory.forEach(entry => {
                const d = entry[0];
                const w = entry[1];
                const g = entry[2];

                if (w > maxWords) maxWords = w;
                if (w > 0) {
                    writingDays.add(d);
                    lastWritingDate = d;
                }
                if (g) {
                    workoutDays.add(d);
                    lastWorkoutDate = d;
                }
            });

            // Calculate Streaks (Iterate through the year up to "today" or last entry?)
            // A streak requires consecutive days.
            // Let's iterate through the sorted history dates is not enough because skipped days break streaks.
            // We should iterate from Jan 1st to Today.
            
            const today = new Date(); // Actual today
            const jan1 = new Date(currentYear, 0, 1);
            
            let wStreak = 0;
            let gStreak = 0;
            
            // We iterate day by day from Jan 1 to Today (or end of year if viewing past year)
            let loopEnd = (currentYear < today.getFullYear()) ? new Date(currentYear, 11, 31) : today;
            
            for (let d = new Date(jan1); d <= loopEnd; d.setDate(d.getDate() + 1)) {
                // ISO YYYY-MM-DD
                const offset = d.getTimezoneOffset(); 
                const localDate = new Date(d.getTime() - (offset*60*1000));
                const iso = localDate.toISOString().split('T')[0];

                // Writing Streak
                if (writingDays.has(iso)) {
                    wStreak++;
                    if (wStreak > longestWritingStreak) longestWritingStreak = wStreak;
                } else {
                    wStreak = 0;
                }

                // Workout Streak
                if (workoutDays.has(iso)) {
                    gStreak++;
                    if (gStreak > longestWorkoutStreak) longestWorkoutStreak = gStreak;
                } else {
                    gStreak = 0;
                }
            }

            // Days Since (Only relevant if viewing CURRENT YEAR)
            // Helper to differ days
            const diffDays = (d1, d2) => Math.floor((d1 - d2) / (1000 * 60 * 60 * 24));
            
            const isPastYear = currentYear < today.getFullYear();
            const daysSinceWrite = (lastWritingDate && !isPastYear) ? diffDays(today, new Date(lastWritingDate)) : "-";
            const daysSinceGym = (lastWorkoutDate && !isPastYear) ? diffDays(today, new Date(lastWorkoutDate)) : "-";

            // Inject into DOM 
            
            let advancedStatsHTML = `
                <div id="advanced-stats-box" class="advanced-stats">
                   <div style="display:flex; justify-content:space-around; text-align:center; flex-wrap:wrap; gap:16px;">
                        <div>
                            <span class="hud-label">Longest Write Streak</span>
                            <span class="hud-value">${longestWritingStreak}</span>
                        </div>
                        <div>
                            <span class="hud-label">Max Words/Day</span>
                            <span class="hud-value">${maxWords}</span>
                        </div>
                        <div>
                            <span class="hud-label">Longest Gym Streak</span>
                            <span class="hud-value">${longestWorkoutStreak}</span>
                        </div>
                   </div>`;

            // Only show "Days Since" row if it is the current year
            if (!isPastYear) {
                advancedStatsHTML += `
                   <div style="margin-top:15px; padding-top:10px; border-top:1px dashed var(--border-color); display:flex; justify-content:space-around;">
                        <div>
                            <span class="hud-label">Days Since Writing</span>
                            <span class="hud-value" style="color:${daysSinceWrite > 7 ? 'red' : 'var(--text-soft)'}">${daysSinceWrite}</span>
                        </div>
                        <div>
                            <span class="hud-label">Days Since Gym</span>
                            <span class="hud-value" style="color:${daysSinceGym > 7 ? 'red' : 'var(--text-soft)'}">${daysSinceGym}</span>
                        </div>
                   </div>
                `;
            }

            // Add the Toggle Link at the bottom of the HUD grid
            if (currentYear === 2026 && typeof history2025 !== 'undefined') {
                 advancedStatsHTML += `
                    <div style="grid-column: 1 / -1; text-align: center; margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 10px;">
                        <a href="#" id="toggle-pace" style="color: var(--text-faint); font-family: var(--font-head); font-size: 0.8rem; text-decoration: none; transition: color 0.2s;">[ Show Last Year Pace ]</a>
                    </div>
                 `;
            }

            advancedStatsHTML += `</div>`;
            
            // Append to HUD
            const hud = document.querySelector('.hud-container');
            if(hud) {
                // Remove existing to avoid duplicates on re-render
                const existing = document.getElementById('advanced-stats-box');
                if (existing) existing.remove();

                // Check if we already added it to avoid dupes on re-renders (if specific logic existed)
                // Just appending is fine for now as this runs once on load
                hud.insertAdjacentHTML('beforeend', advancedStatsHTML);
                
                // --- GHOST SHIP LOGIC (Option 1: Ghost Text) ---
                const toggleBtn = document.getElementById('toggle-pace');
                if (toggleBtn) {
                    toggleBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        // Check if already active
                        const isActive = toggleBtn.classList.contains('active');
                        
                        if (!isActive) {
                            // TURN ON
                            toggleBtn.classList.add('active');
                            toggleBtn.innerHTML = "[ Hide Last Year Pace ]";
                            toggleBtn.style.color = "var(--accent-color)";
                            
                            // 1. Calculate 2025 YTD
                            const now = new Date();
                            const currentMonth = now.getMonth();
                            const currentDay = now.getDate();
                            
                            let words2025 = 0;
                            let workouts2025 = 0;
                            
                            history2025.forEach(entry => {
                                const d = new Date(entry[0] + "T00:00:00");
                                if (d.getFullYear() === 2025) {
                                    if (d.getMonth() < currentMonth || (d.getMonth() === currentMonth && d.getDate() <= currentDay)) {
                                        words2025 += entry[1];
                                        if (entry[2]) workouts2025++;
                                    }
                                }
                            });

                            // 2. Calculate Diffs
                            const wordDiff = totalWords - words2025;
                            const gymDiff = totalWorkouts - workouts2025;
                            
                            // 3. Inject Ghost Text
                            injectGhostStat('total-words', words2025, wordDiff);
                            injectGhostStat('total-workouts', workouts2025, gymDiff);

                        } else {
                            // TURN OFF
                            toggleBtn.classList.remove('active');
                            toggleBtn.innerHTML = "[ Show Last Year Pace ]";
                            toggleBtn.style.color = "var(--text-faint)";
                            
                            // Remove Ghost Text
                            document.querySelectorAll('.ghost-stat').forEach(el => el.remove());
                        }
                    });
                }
            }
            
            // Helper for Ghost Stat Injection
            function injectGhostStat(parentId, pastValue, diff) {
                const parent = document.getElementById(parentId).parentNode;
                const sign = diff >= 0 ? "+" : "";
                const color = diff >= 0 ? "var(--accent-color)" : "var(--text-soft)";
                
                const html = `
                    <div class="ghost-stat" style="font-family: var(--font-head); font-size: 0.8rem; color: var(--text-faint); margin-top: 5px; animation: fadeIn 0.5s;">
                        <span style="color:${color}">${sign}${diff.toLocaleString()}</span> vs 2025
                    </div>
                `;
                
                parent.insertAdjacentHTML('beforeend', html);
            }

            // 2. GENERATE CALENDAR GRID (Jan 1 to Dec 31)
            const gridContainer = document.getElementById('year-grid');
            if (gridContainer) {
                gridContainer.innerHTML = ""; // Clear for re-render if needed
                const startDate = new Date(currentYear, 0, 1); // Jan 1
                const endDate = new Date(currentYear, 11, 31); // Dec 31
                
                // Align the grid so each row corresponds to a weekday (SUN..SAT).
                // We do this by inserting "placeholder" cells before Jan 1.
                const leadingBlanks = startDate.getDay(); // 0=SUN ... 6=SAT
                for (let i = 0; i < leadingBlanks; i++) {
                    const blank = document.createElement('div');
                    blank.className = 'day-cell placeholder';
                    gridContainer.appendChild(blank);
                }

                // Iterate through every single day of the year
                for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                    
                    // Format date as YYYY-MM-DD (Local)
                    const offset = d.getTimezoneOffset(); 
                    const localDate = new Date(d.getTime() - (offset*60*1000));
                    const isoDate = localDate.toISOString().split('T')[0];
                    
                    // Get data for this day (or default to 0)
                    const data = dayMap[isoDate] || { words: 0, gym: false, notes: [] };

                    // Create the HTML square
                    const cell = document.createElement('div');
                    cell.className = 'day-cell';

                    /* --- NEW VISUAL LOGIC START --- */

                    // 1. SEASONAL HUES
                    // Month is 0-indexed (0 = Jan, 11 = Dec)
                    const month = d.getMonth(); 
                    if (month === 11 || month === 0 || month === 1) cell.classList.add('season-winter');
                    else if (month >= 2 && month <= 4) cell.classList.add('season-spring');
                    else if (month >= 5 && month <= 7) cell.classList.add('season-summer');
                    else cell.classList.add('season-fall');

                    // 2. BLOG POSTS (Landmarks)
                    if (typeof posts !== 'undefined') {
                        const blogPost = posts.find(p => p[2] === isoDate);
                        if (blogPost) {
                            cell.classList.add('has-post');
                            cell.onclick = () => window.location.href = `home.html?post=${blogPost[0]}`;
                        }
                    }

                    // 3. MICRO-NOTES (Dog Ear)
                    if (data.notes && data.notes.length > 0) {
                        cell.classList.add('has-note');
                    }
                    
                    /* --- END NEW VISUAL LOGIC --- */

                    // Current Day Indicator (local calendar date, not UTC)
                    const todayStr = toLocalISODate();
                    if (isoDate === todayStr) {
                        // Use inline style for dynamic color
                        let borderColor = 'var(--text-strong)'; // Fallback
                        if (month === 11 || month === 0 || month === 1) borderColor = '#64b5f6';
                        else if (month >= 2 && month <= 4) borderColor = '#9ccc65';
                        else if (month >= 5 && month <= 7) borderColor = '#ffb74d';
                        else borderColor = '#e57373';

                        cell.style.border = `1px solid ${borderColor}`;
                        cell.style.boxShadow = `0 0 6px ${borderColor}`;
                        cell.style.zIndex = "10";
                    }
                    
                    // Determine Color Level
                    if (data.words > 1500) cell.classList.add('lvl-3');
                    else if (data.words > 500) cell.classList.add('lvl-2');
                    else if (data.words > 0) cell.classList.add('lvl-1');
                    else cell.classList.add('lvl-0');

                    // Add Gym Dot
                    if (data.gym) {
                        const dot = document.createElement('div');
                        dot.className = 'gym-dot';
                        cell.appendChild(dot);
                    }

                    // Prepare Tooltip Data
                    const dateString = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    let tooltipText = `${dateString}\nWords: ${data.words}`;
                    if (data.gym) tooltipText += `\nGym: Yes`;
                    
                    // Show Blog Post title in tooltip
                    if (typeof posts !== 'undefined') {
                        const blogPost = posts.find(p => p[2] === isoDate);
                        if (blogPost) tooltipText += `\n\n★ Posted: ${blogPost[1]}`;
                    }
                    
                    if (data.notes && data.notes.length > 0) {
                        data.notes.forEach(note => {
                            tooltipText += `\n\n• ${note}`;
                        });
                    }
                    
                    cell.setAttribute('data-tooltip', tooltipText);

                    gridContainer.appendChild(cell);
                }
            }

            /* --- TOOLTIP LOGIC (The Floating Fix) --- */
            const tooltip = document.getElementById('tooltip');
            const cells = document.querySelectorAll('.day-cell');

            cells.forEach(cell => {
                cell.addEventListener('mouseenter', (e) => {
                    const text = e.target.getAttribute('data-tooltip');
                    if (text) {
                        tooltip.innerText = text;
                        tooltip.style.opacity = '1';
                    }
                });

                cell.addEventListener('mousemove', (e) => {
                    // Move the tooltip with the mouse, offset slightly up
                    tooltip.style.left = e.clientX + 'px';
                    tooltip.style.top = (e.clientY - 10) + 'px';
                });

                cell.addEventListener('mouseleave', () => {
                    tooltip.style.opacity = '0';
                });
            });


            // 3. RENDER LISTS
            
            // Books
            const bookContainer = document.getElementById('book-list');
            if (bookContainer && activeBooks) {
                bookContainer.innerHTML = "";
                activeBooks.forEach(book => {
                    let metaHTML = `by ${book.author}`;
                    if (book.review) {
                        metaHTML += ` — <em>"${book.review}"</em>`;
                    }
                    
                    bookContainer.innerHTML += `
                        <div class="ledger-item">
                            <span class="ledger-title">${book.title}</span>
                            <span class="ledger-meta">${metaHTML}</span>
                        </div>
                    `;
                });
            }

            // Albums
            const albumContainer = document.getElementById('album-list');
            if (albumContainer && activeAlbums) {
                albumContainer.innerHTML = "";
                activeAlbums.forEach(album => {
                    albumContainer.innerHTML += `
                        <div class="ledger-item">
                            <span class="ledger-title">${album.title}</span>
                            <span class="rating-stars">${"★".repeat(album.rating)}</span>
                            <span class="ledger-meta">${album.artist}</span>
                        </div>
                    `;
                });
            }

            // PR Stats
            const statsContainer = document.getElementById('stats-list');
            if (statsContainer && activeStats) {
                statsContainer.innerHTML = "";
                activeStats.forEach(stat => {
                    statsContainer.innerHTML += `
                        <div class="stat-row">
                            <span>${stat.label}</span>
                            <span class="log-strong">${stat.value}</span>
                        </div>
                    `;
                });
            }

            // Bands Seen
            const bandContainer = document.getElementById('band-list');
            if (bandContainer && activeShows) {
                let html = '<ul style="list-style:none; padding:0; color:var(--text-soft); font-family: var(--font-head);">';
                activeShows.forEach(band => {
                    html += `
                        <li style="border-bottom:1px dashed var(--border-color); padding:10px 0;">
                            <span class="log-strong">${band}</span>
                        </li>
                    `;
                });
                html += '</ul>';
                bandContainer.innerHTML = html;
            }

        } // End initDashboard
    </script>
</body>
</html>
