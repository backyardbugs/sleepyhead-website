<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome — Sleepyhead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=19">
    <script src="muji-init.js"></script>
    <script src="theme-init.js"></script>
    <style>
        body.splash-page {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            font-family: 'DM Sans', system-ui, sans-serif;
            overflow: hidden;
        }

        .splash-stage {
            text-align: center;
            padding: 2rem;
            opacity: 0;
            animation: splash-in 1s ease forwards;
        }

        body.splash-out .splash-stage {
            animation: splash-out 0.7s ease forwards;
        }

        .splash-logo {
            max-width: min(320px, 80vw);
            height: auto;
            display: block;
            margin: 0 auto 2rem;
            image-rendering: auto;
        }

        .splash-welcome {
            color: #e0e0e0;
            font-size: clamp(1rem, 3vw, 1.25rem);
            font-weight: 500;
            letter-spacing: 0.04em;
            margin: 0;
            opacity: 0;
            animation: splash-text-in 0.8s ease 0.6s forwards;
        }

        @keyframes splash-in {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes splash-text-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes splash-out {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(1.02); }
        }
    </style>
</head>
<body class="splash-page">
    <div class="splash-stage" id="splash-stage">
        <img
            class="splash-logo"
            src="img/UI%20stuff/logo.gif"
            alt="Sleepyhead"
            width="320"
            height="320"
        >
        <p class="splash-welcome">Welcome to the office of Sleepyhead.</p>
    </div>

    <script>
    (function () {
        if (window.location.search) {
            window.location.replace('home.html' + window.location.search);
            return;
        }

        var REDIRECT_MS = 4200;
        var FADE_MS = 650;
        var leaving = false;
        var fadeTimer = null;
        var autoTimer = setTimeout(goHome, REDIRECT_MS);

        function goHome() {
            if (leaving) return;
            leaving = true;
            clearTimeout(autoTimer);
            if (fadeTimer) clearTimeout(fadeTimer);

            document.body.classList.add('splash-out');
            fadeTimer = setTimeout(function () {
                window.location.replace('home.html');
            }, FADE_MS);
        }

        document.body.addEventListener('click', goHome, { once: true });
    })();
    </script>
</body>
</html>
