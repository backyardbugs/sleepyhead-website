<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepyhead Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=7">
    <script src="muji-init.js"></script>

</head>
<body>

    <div class="container">
        
        <aside id="sidebar-container"></aside>

        <main>
            <div id="blog-feed"></div> 
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    
    <script>
    /* --- THE MASTER LOADER --- */
    /* Automatically loads the latest version of your code */
    
    (function() {
        var stamp = Date.now(); // Get the current time (e.g., 170234...)

        // List of scripts to load
        var scriptsToLoad = [
            "loader.js", // The Sidebar Agent
            "blog.js"    // The Blog Data
        ];
        
        // Helper: load script
        function loadScript(src, callback) {
            var s = document.createElement('script');
            s.src = src + "?v=" + stamp;
            s.onload = callback;
            document.body.appendChild(s);
        }

        // LOAD SEQUENCE
        // 1. Sidebar Loader & Blog Data (Parallel-ish)
        loadScript("loader.js");
        
        loadScript("blog.js", function() {
            // 2. Only after Blog Data is ready, load the Engine
            loadScript("engine.js");
        });

    })();
</script>

</body>
</html>
